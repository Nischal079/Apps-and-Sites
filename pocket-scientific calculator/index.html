<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d1017">
<title>Pocket Scientific</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <main class="calc" aria-label="Scientific calculator">
    <header class="statusbar">
      <button class="chip" id="angleChip" type="button" aria-label="Angle mode: degrees. Activate to change">DEG</button>
      <span class="flag" id="secondFlag" hidden>2nd</span>
      <span class="flag" id="memFlag" hidden>M</span>
      <span class="spacer"></span>
      <button class="icon" id="copyBtn" type="button" aria-label="Copy result">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
      <button class="icon history-toggle" id="historyBtn" type="button" aria-label="Show history" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon" id="themeBtn" type="button" aria-label="Switch to light theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </header>

    <section class="display">
      <div class="expr" id="expr" role="textbox" aria-readonly="true" aria-label="Expression"></div>
      <div class="result" id="result" data-size="lg">0</div>
      <div class="error" id="error" hidden></div>
    </section>

    <div class="pad sci" id="sciPad">
      <button class="key fn" data-act="fn" data-val="sqrt" data-alt-act="fn" data-alt-val="cbrt" data-alt-label="∛" data-alt-aria="cube root" aria-label="square root">√</button>
      <button class="key fn" data-act="post" data-val="sq" data-alt-act="post" data-alt-val="cube" data-alt-label="x³" data-alt-aria="x cubed" aria-label="x squared">x²</button>
      <button class="key fn" data-act="op" data-val="^" data-alt-act="root" data-alt-label="ʸ√x" data-alt-aria="y-th root" aria-label="x to the power of y">xʸ</button>
      <button class="key fn" data-act="post" data-val="inv" data-alt-act="fn" data-alt-val="abs" data-alt-label="|x|" data-alt-aria="absolute value" aria-label="reciprocal">1/x</button>
      <button class="key fn" data-act="fn" data-val="ln" data-alt-act="fn" data-alt-val="exp" data-alt-label="eˣ" data-alt-aria="e to the power of x" aria-label="natural log">ln</button>
      <button class="key fn" data-act="fn" data-val="log" data-alt-act="fn" data-alt-val="pow10" data-alt-label="10ˣ" data-alt-aria="10 to the power of x" aria-label="log base 10">log</button>
      <button class="key fn" data-act="fn" data-val="sin" data-alt-act="fn" data-alt-val="asin" data-alt-label="sin⁻¹" data-alt-aria="inverse sine" aria-label="sine">sin</button>
      <button class="key fn" data-act="fn" data-val="cos" data-alt-act="fn" data-alt-val="acos" data-alt-label="cos⁻¹" data-alt-aria="inverse cosine" aria-label="cosine">cos</button>
      <button class="key fn" data-act="fn" data-val="tan" data-alt-act="fn" data-alt-val="atan" data-alt-label="tan⁻¹" data-alt-aria="inverse tangent" aria-label="tangent">tan</button>
      <button class="key fn" data-act="post" data-val="!" data-alt-act="op" data-alt-val="npr" data-alt-label="nPr" data-alt-aria="permutations" aria-label="factorial">n!</button>
      <button class="key fn" data-act="op" data-val="ncr" data-alt-act="op" data-alt-val="mod" data-alt-label="mod" data-alt-aria="modulo" aria-label="combinations">nCr</button>
      <button class="key fn" data-act="const" data-val="pi" data-alt-act="const" data-alt-val="e" data-alt-label="e" data-alt-aria="Euler's number" aria-label="pi">π</button>
      <button class="key shift" id="secondKey" data-act="second" aria-label="toggle second functions" aria-pressed="false">2nd</button>
      <button class="key fn" data-act="op" data-val="exp" data-alt-act="const" data-alt-val="rand" data-alt-label="rand" data-alt-aria="random number" aria-label="times ten to the power of">EXP</button>
      <button class="key fn" data-act="post" data-val="%" aria-label="percent">%</button>
      <button class="key fn" data-act="ans" data-alt-act="memory" data-alt-val="add" data-alt-label="M+" data-alt-aria="add to memory" aria-label="last answer">Ans</button>
    </div>

    <div class="pad basic" id="basicPad">
      <button class="key util" data-act="clear" aria-label="clear">AC</button>
      <button class="key util" data-act="paren" data-val="(" aria-label="open parenthesis">(</button>
      <button class="key util" data-act="paren" data-val=")" aria-label="close parenthesis">)</button>
      <button class="key util backspace" data-act="backspace" aria-label="backspace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L3 12l6-7Z"/><path d="m12.5 10 3.5 4M16 10l-3.5 4"/></svg>
      </button>
      <button class="key op" data-act="op" data-val="/" aria-label="divide">÷</button>

      <button class="key num" data-act="digit" data-val="7">7</button>
      <button class="key num" data-act="digit" data-val="8">8</button>
      <button class="key num" data-act="digit" data-val="9">9</button>
      <button class="key util" data-act="memory" data-val="add" aria-label="add to memory">M+</button>
      <button class="key op" data-act="op" data-val="*" aria-label="multiply">×</button>

      <button class="key num" data-act="digit" data-val="4">4</button>
      <button class="key num" data-act="digit" data-val="5">5</button>
      <button class="key num" data-act="digit" data-val="6">6</button>
      <button class="key util" data-act="memory" data-val="recall" aria-label="recall memory">MR</button>
      <button class="key op" data-act="op" data-val="-" aria-label="subtract">−</button>

      <button class="key num" data-act="digit" data-val="1">1</button>
      <button class="key num" data-act="digit" data-val="2">2</button>
      <button class="key num" data-act="digit" data-val="3">3</button>
      <button class="key util" data-act="memory" data-val="clear" aria-label="clear memory">MC</button>
      <button class="key op" data-act="op" data-val="+" aria-label="add">+</button>

      <button class="key util" data-act="sign" aria-label="toggle sign">±</button>
      <button class="key num" data-act="digit" data-val="0">0</button>
      <button class="key num" data-act="decimal" aria-label="decimal point">.</button>
      <button class="key util" data-act="ans" aria-label="last answer">Ans</button>
      <button class="key eq" data-act="equals" aria-label="equals">=</button>
    </div>

    <p class="hint">Keyboard ready — Enter to calculate</p>
    <div class="live sr-only" id="live" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside class="history" id="historyPanel" aria-label="Calculation history">
    <header class="history-head">
      <h2>History</h2>
      <span class="spacer"></span>
      <button class="ghost" id="clearHistory" type="button">Clear all</button>
      <button class="icon close-history" id="closeHistory" type="button" aria-label="Close history">×</button>
    </header>
    <div class="history-list" id="historyList"></div>
    <p class="empty" id="historyEmpty">Nothing yet. Your calculations will show up here.</p>
  </aside>
</div>
<div class="backdrop" id="backdrop" hidden></div>

<script src="calc.js"></script>
<script src="app.js"></script>
<script src="calc.test.js"></script>
</body>
</html>
